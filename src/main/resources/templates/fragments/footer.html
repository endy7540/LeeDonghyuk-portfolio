<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" id="contact" class="site-footer">
    <div class="footer-inner">
        <div class="footer-title">감사합니다.<br>잘 부탁드립니다.</div>
        <div class="footer-contact">
            <span th:if="${profile.phone}">📞 <span th:text="${profile.phone}">010-0000-0000</span></span>
            <span th:if="${profile.email}">✉️ <span th:text="${profile.email}">example@gmail.com</span></span>
            <span th:if="${profile.github}">
                🔗 <a th:href="${profile.github}" th:text="${profile.github}" target="_blank" style="color:inherit;">github</a>
            </span>
        </div>
    </div>
</footer>
</body>
</html>
